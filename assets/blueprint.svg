<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="240">
  <rect width="800" height="400" fill="#0d0d0d" stroke="#333333" stroke-width="2"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Outer perimeter -->
  <rect x="40" y="40" width="720" height="320" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Sectors -->
  <!-- Sector Alpha -->
  <rect x="70" y="70" width="280" height="110" fill="#181818" stroke="#444444" stroke-width="1.5"/>
  <text x="90" y="105" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">SECTOR ALPHA-7</text>
  <text x="90" y="130" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">CREW QUARTERS // LIVING ROOM</text>

  <!-- Sector Beta -->
  <rect x="450" y="70" width="280" height="110" fill="#181818" stroke="#444444" stroke-width="1.5"/>
  <text x="470" y="105" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">SECTOR BETA-4</text>
  <text x="470" y="130" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">RATION STORAGE // PANTRY</text>

  <!-- Central Vault Quarantine (The target: VAULT 9) -->
  <rect x="250" y="210" width="300" height="120" fill="#141414" stroke="#ffffff" stroke-width="2"/>
  <rect x="260" y="220" width="280" height="100" fill="#000000" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="280" y="255" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" letter-spacing="1">VAULT 9</text>
  <text x="280" y="280" fill="#aaaaaa" font-family="'JetBrains Mono', monospace" font-size="11">HIGH-SECURITY QUARANTINE BLOCK</text>
  <text x="280" y="300" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10">STATUS: SEALED // BIOMETRIC LOCK</text>

  <!-- Sector Delta -->
  <rect x="70" y="210" width="150" height="120" fill="#181818" stroke="#444444" stroke-width="1.5"/>
  <text x="85" y="255" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">DELTA-2</text>
  <text x="85" y="280" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">COURTYARD DRILL</text>

  <!-- Header Stamp -->
  <text x="50" y="28" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2">BIG BOSS SURVEILLANCE SCHEMATIC // REV 4.2</text>
  <text x="610" y="28" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10">TOP SECRET // CLASSIFIED</text>
</svg>
